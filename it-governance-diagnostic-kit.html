<title>IT Governance Diagnostic Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: boardroom ledger — deep-pine header band, numbered step rail + working column; evidence questions as ledger rows; presentation as 16:9 slides */
:root{
  --paper:#EEF1EC; --surface:#F8FAF6; --sunk:#E3E9E4; --ink:#12201B; --muted:#56645E; --line:#C9D3CC;
  --panel:#12201B; --panel-ink:#EEF1EC; --panel-muted:#A9BBB2; --panel-line:#2E433A;
  --accent:#1F6B52; --accent-ink:#FFFFFF; --accent-wash:#DDEBE4;
  --brass:#D9A84A; --brass-ink:#875C10; --brass-wash:#F4E6C6;
  --strong:#1F6B52; --strong-wash:#DDEBE4; --partial:#875C10; --partial-wash:#F4E6C6;
  --weak:#A3392B; --weak-wash:#F5E1DC; --na:#6E7C76; --na-wash:#E3E9E4;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  /* presentation slides keep one fixed look in both themes */
  --sl-paper:#EEF1EC; --sl-card:#F8FAF6; --sl-ink:#12201B; --sl-muted:#4F5D57; --sl-line:#C9D3CC;
  --sl-deep:#12201B; --sl-deep-ink:#EEF1EC; --sl-deep-muted:#B7C7BF; --sl-deep-line:#2E433A;
  --sl-brass:#D9A84A; --sl-brass-ink:#875C10; --sl-green:#1F6B52; --sl-rust:#A3392B;
  --overlay:#080D0B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1512; --surface:#141F1B; --sunk:#1B2823; --ink:#E3EAE6; --muted:#98A9A1; --line:#2B3A34;
  --panel:#0A110E; --panel-ink:#E9EFEB; --panel-muted:#9FB3AA; --panel-line:#25362F;
  --accent:#5FBF98; --accent-ink:#0B1411; --accent-wash:#17302A;
  --brass:#D9A84A; --brass-ink:#E2B865; --brass-wash:#2C2516;
  --strong:#5FBF98; --strong-wash:#17302A; --partial:#E2B865; --partial-wash:#2C2516;
  --weak:#EE8D7A; --weak-wash:#33201C; --na:#8A9A93; --na-wash:#1B2823; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1512; --surface:#141F1B; --sunk:#1B2823; --ink:#E3EAE6; --muted:#98A9A1; --line:#2B3A34;
  --panel:#0A110E; --panel-ink:#E9EFEB; --panel-muted:#9FB3AA; --panel-line:#25362F;
  --accent:#5FBF98; --accent-ink:#0B1411; --accent-wash:#17302A;
  --brass:#D9A84A; --brass-ink:#E2B865; --brass-wash:#2C2516;
  --strong:#5FBF98; --strong-wash:#17302A; --partial:#E2B865; --partial-wash:#2C2516;
  --weak:#EE8D7A; --weak-wash:#33201C; --na:#8A9A93; --na-wash:#1B2823; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.ar{display:none;direction:rtl;text-align:right;font-family:var(--f-ar);color:var(--muted);font-size:14px;line-height:1.75}
.show-ar .ar{display:block}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);color:var(--panel-ink);border-bottom:1px solid var(--panel-line)}
.top-in{max-width:1320px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--panel-ink)}
.brand .m{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.2px}
.brand .n{font-family:var(--f-mono);font-size:12px;letter-spacing:2px;color:var(--brass);text-transform:uppercase}
.co{display:flex;align-items:center;gap:10px;flex:1 1 280px;min-width:0}
.co select{flex:0 1 340px;min-width:0;background:var(--panel-line);border:1px solid var(--panel-line);color:var(--panel-ink);border-radius:8px;padding:6px 10px}
.save{font-size:12px;color:var(--panel-muted);font-family:var(--f-mono);white-space:nowrap}
.save.fail{color:var(--brass)}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--panel-muted);cursor:pointer;font-family:var(--f-ar)}
.top .btn{background:transparent;color:var(--panel-ink);border-color:var(--panel-line)}
.top .btn.pri{background:var(--brass);color:#12201B;border-color:var(--brass)}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--weak);color:var(--weak)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.banner{background:var(--brass-wash);color:var(--ink);border-bottom:1px solid var(--line);font-size:14px}
.banner .in{max-width:1320px;margin-inline:auto;padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}

/* shell */
.shell{max-width:1320px;margin-inline:auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:36px;padding-block:28px 72px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:grid;gap:2px;max-height:calc(100vh - 100px);overflow:auto}
.st{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--muted)}
.st:hover{background:var(--sunk);color:var(--ink)}
.st[aria-current="page"]{background:var(--panel);color:var(--panel-ink)}
.st .nb{font-family:var(--f-mono);font-size:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.st[aria-current="page"] .nb{border-color:var(--brass);color:var(--brass)}
.st .lb{display:grid;line-height:1.3;font-weight:600;font-size:14px;min-width:0}
.st .lb small{font-weight:400;font-size:11.5px;font-family:var(--f-mono);opacity:.8}
.st .pg{font-family:var(--f-mono);font-size:11.5px}
.st .pg.done{color:var(--strong)}
.st[aria-current="page"] .pg.done{color:var(--brass)}

.main{min-width:0;display:grid;gap:28px;align-content:start}
.sh{display:grid;gap:8px;max-width:78ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass-ink)}
.sh h1{font-family:var(--f-display);font-weight:600;font-size:36px;letter-spacing:-.2px}
.lede{font-size:17px;color:var(--muted);max-width:72ch}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:23px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;gap:14px;align-content:start;min-width:0}
.card.dark{background:var(--panel);color:var(--panel-ink);border-color:var(--panel)}
.card.dark .muted{color:var(--panel-muted)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stepnav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}

/* fields */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}
.fld{display:grid;gap:6px;align-content:start;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>label,.lab{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
textarea{resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--na)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);font-size:13.5px;cursor:pointer}
.ck:has(input:checked){border-color:var(--accent);background:var(--accent-wash)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.chip.strong{background:var(--strong-wash);color:var(--strong)}
.chip.partial{background:var(--partial-wash);color:var(--partial)}
.chip.weak{background:var(--weak-wash);color:var(--weak)}
.chip.na{background:var(--na-wash);color:var(--na)}
.tag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.5px}

/* question cards */
.qlist{display:grid;gap:10px}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.qc[data-a="3"]{border-inline-start:4px solid var(--strong)}
.qc[data-a="2"]{border-inline-start:4px solid var(--partial)}
.qc[data-a="1"],.qc[data-a="0"]{border-inline-start:4px solid var(--weak)}
.qc[data-a="-1"]{border-inline-start:4px dashed var(--na)}
.qt{font-weight:600;max-width:80ch}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt span{border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13.5px;background:var(--paper);cursor:pointer}
.opt input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.opt.o3 input:checked+span{background:var(--strong);border-color:var(--strong);color:var(--accent-ink)}
.opt.o2 input:checked+span{background:var(--partial);border-color:var(--partial);color:var(--paper)}
.opt.o1 input:checked+span,.opt.o0 input:checked+span{background:var(--weak);border-color:var(--weak);color:var(--paper)}
.opt.ou input:checked+span{background:var(--na);border-color:var(--na);color:var(--paper)}
.evrow{display:grid;grid-template-columns:210px minmax(0,1fr);gap:8px}
.qc[data-a=""] .evrow,.qc[data-a="-1"] .evrow{display:none}
.capnote{font-size:12.5px;color:var(--partial);font-weight:600}
.capnote:empty{display:none}

/* principle blocks */
.pnav{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:5;background:var(--paper);padding-block:8px;border-bottom:1px solid var(--line)}
.pnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.pblock{display:grid;gap:12px;scroll-margin-top:130px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.phead h2{font-family:var(--f-display);font-weight:600;font-size:26px}
.pdef{color:var(--muted);max-width:75ch}
.pscore{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:14px}

/* stakeholder rows */
.shl{display:grid;gap:8px}
.shr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.shr b{display:block}
.shr small{color:var(--muted);font-size:13px;line-height:1.4;display:block}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
th{background:var(--sunk);font-size:12.5px;font-weight:600;color:var(--muted)}
tr:last-child td{border-bottom:0}
.raci{min-width:860px}
.raci select{padding:5px 6px;text-align:center;font-family:var(--f-mono);font-weight:600;width:72px}
.raci th input{font-size:12.5px;font-weight:600;padding:5px 7px}
.raci td.c{text-align:center}
.pol{min-width:760px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--weak);background:var(--weak-wash)}

/* lifecycle */
.life{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.life div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:var(--surface)}
.life b{font-size:13.5px;line-height:1.3}
.life .s{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.life .done{border-color:var(--strong)}
.life .done .s{color:var(--strong)}
.life .here{background:var(--brass);border-color:var(--brass);color:#12201B}
.life .here .s{color:#12201B}
.life .next{border-style:dashed;color:var(--muted)}

/* bars */
.bars{display:grid;gap:8px}
.bscale,.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 48px 128px;gap:12px;align-items:center}
.bscale{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.bscale .ax{position:relative;height:16px}
.bscale .ax span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.brow .bn{font-weight:600;font-size:14px}
.track{position:relative;height:10px;background:var(--sunk);border-radius:5px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:5px}
.fill.strong{background:var(--strong)} .fill.partial{background:var(--partial)} .fill.weak{background:var(--weak)} .fill.na{background:var(--na)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--surface)}
.bp{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.tile .v{font-size:28px;font-weight:600;line-height:1.1}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile.lead{background:var(--panel);border-color:var(--panel);color:var(--panel-ink)}
.tile.lead .k{color:var(--panel-muted)}
.tile.lead .v{font-size:40px;color:var(--brass)}

.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.dot.strong{background:var(--strong)} .dot.weak{background:var(--weak)} .dot.partial{background:var(--partial)} .dot.na{border:2px solid var(--na)}
ol.recs{margin:0;padding-inline-start:22px;display:grid;gap:8px}
ol.recs li::marker{font-family:var(--f-mono);color:var(--brass-ink);font-weight:600}

.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rules .card h3{font-size:16px}
.legend{width:100%;font-size:13.5px}
.legend td,.legend th{padding:6px 8px}

.saved li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.newf{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.newf .fld{flex:1 1 260px}

.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--brass)}
.card.dark .prog{background:var(--panel-line)}

/* report paper */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:44px 52px;max-width:860px;display:grid;gap:12px;font-size:14.5px;line-height:1.6}
.paper h1{font-family:var(--f-display);font-size:28px;font-weight:600}
.paper h2{font-size:17px;color:var(--accent);margin-top:10px}
.paper h3{font-size:15px}
.paper .meta{color:var(--muted);font-size:13px}
.paper ul,.paper ol{margin:0;padding-inline-start:22px;display:grid;gap:4px}
.paper table{font-size:13px}
.paper td,.paper th{border:1px solid var(--line);vertical-align:top}
.edit{display:grid;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wc{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.wc.over{color:var(--weak)}
.note{font-size:13px;color:var(--muted)}

/* discussion */
.quote{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.25;max-width:30ch}
.pos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.posc{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);cursor:pointer;display:grid;gap:4px}
.posc input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.posc:has(input:checked){border-color:var(--accent);background:var(--accent-wash)}
.posc:has(input:focus-visible){outline:2px solid var(--brass);outline-offset:2px}
.posc b{font-size:14.5px}
.posc span{font-size:13px;color:var(--muted)}
details.gp{border-top:1px solid var(--line);padding-block:10px}
details.gp summary{cursor:pointer;font-weight:600}
details.gp p{margin-top:8px;max-width:78ch}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--panel-ink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;max-width:calc(100% - 32px);opacity:0;pointer-events:none}
.toast.on{opacity:1}

/* presentation */
.present{position:fixed;inset:0;z-index:100;background:var(--overlay);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pwrap{display:grid;place-items:center;min-height:0}
.stage{container-type:inline-size;position:relative;width:min(100%,calc((100dvh - 110px) * 16 / 9));aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden}
.pbar{display:flex;justify-content:center;align-items:center;gap:10px;padding-top:12px;color:#C9D3CC;font-family:var(--f-mono);font-size:13px;flex-wrap:wrap}
.pbar button{background:#1B2823;border:1px solid #2E433A;color:#EEF1EC;border-radius:8px;padding:6px 14px;cursor:pointer}

.sl{position:absolute;inset:0;padding:4.6cqw 5.6cqw 6cqw;display:flex;flex-direction:column;gap:1.8cqw;background:var(--sl-paper);color:var(--sl-ink);font-family:var(--f-body);font-size:1.5cqw;line-height:1.4;overflow:hidden}
.sl.dk{background:var(--sl-deep);color:var(--sl-deep-ink)}
.sl.br{background:var(--sl-brass);color:var(--sl-ink)}
.sl .eb{font-family:var(--f-mono);font-size:1.05cqw;letter-spacing:.2cqw;text-transform:uppercase;color:var(--sl-brass-ink)}
.sl.dk .eb{color:var(--sl-brass)}
.sl.br .eb{color:var(--sl-ink)}
.sl h2{font-family:var(--f-display);font-weight:600;font-size:3.4cqw;line-height:1.1}

 if(M.amb.length)t.push(`It appears ambiguous for ${listJoin(M.amb.map(x=>`“${x.d}” (${x.why})`))}.`);
 if(!M.clear.length&&!M.amb.length)t.push("Decision rights have not been mapped yet, so the clarity of responsibility cannot be judged.");
 if(M.clear.length&&M.amb.length)t.push("The pattern is that responsibility is clear where IT work is done and less clear where IT decisions are made.");
 const r=M.pr.resp;if(r.rating!=="na")t.push(`The ISO/IEC 38500 Responsibility principle rates ${RL[r.rating].toLowerCase()} (${r.pct}%)${eff(PR[0].qs[2])!==null&&eff(PR[0].qs[2])<3&&eff(PR[0].qs[2])>=0?", and responsibility is not always matched with the authority to act":""}.`);
 const sv=sepVerdict(M);if(M.gov.rating!=="na")t.push(`Because governance and management are ${sv[0].toLowerCase()}, ${M.gov.rating==="strong"?"accountability can be traced from decision to delivery":"it is hard to tell who answers when an IT decision goes wrong"}.`);
 t.push("Part 2 will test these observations against documents and interviews.");
 return t.join(" ");}
function invRow(){return S.raci.rows.find(r=>/invest/i.test(r.d))||S.raci.rows[1]||S.raci.rows[0];}
function draftDiscussion(M){const o=S.org,name=o.name||"this organization";const pos=S.disc.pos||"layered";
 const open={board:"I hold that the board carries ultimate accountability. It approved the investment and set the risk appetite, and accountability for an outcome cannot be fully delegated away (Slide 54). Executive management and the CIO still answer for their own decisions within that frame.",
 exec:"I hold that executive management carries the main accountability, because it turned the strategy into a plan, allocated the resources and oversaw delivery. The board answers for its approval decision, and the CIO for technical delivery.",
 cio:"I hold that the CIO is the first to answer, as the direct technical and operational owner. That is fair only if the CIO had the authority to match the responsibility; otherwise accountability moves up to whoever held the decision rights.",
 layered:"I hold that accountability should be layered by decision rather than pooled."}[pos];
 const core="The board answers for approving the investment and for the risk appetite behind it; executive management answers for turning the strategy into a funded, overseen plan; the CIO answers for delivery within the approved scope, budget and risk limits, and for escalating early. Each of these decisions needs exactly one accountable owner, recorded in a RACI, so that sharing does not dilute accountability. The ISO/IEC 38500 Responsibility principle supports this: responsibility must be assigned, understood and accepted, and matched with the authority to act.";
 const ir=invRow();let local=[];
 if(ir){const st=raciStatus(ir);if(st.s==="clear"||(st.A.length===1))local.push(`In ${name}, the ${roleName(st.A[0])} is accountable for “${ir.d}”`);else local.push(`In ${name}, no single role is accountable for “${ir.d}”`);}
 const b=S.sh.board;if(b&&b.level!=null)local.push(`the board or owners ${["are not involved in IT decisions","are only informed about IT decisions","are consulted on IT decisions","decide on major IT matters"][b.level]}`);
 const amb=M.amb.filter(x=>x.d!==(ir&&ir.d));if(amb.length)local.push(`and ${listJoin(amb.slice(0,3).map(x=>"“"+x.d+"”"))} ${amb.length===1?"has":"have"} no clear owner`);
 let tail=local.length?local.join("; ")+".":"";
 tail+=` If an IT investment failed here today, ${ir&&raciStatus(ir).A.length===1?"the "+roleName(raciStatus(ir).A[0])+" would answer for the approval decision, but the decisions without an owner would leave gaps that no one could be held to.":"it would be hard to say who answers, which is itself the main governance finding."}`;
 return [open,core,tail.trim()].join("\n\n");}

/* ============ live refresh ============ */
function refreshLive(){const M=metrics();
 document.querySelectorAll("[data-live]").forEach(el=>{const k=el.dataset.live;
  if(k.startsWith("pg-")){const p=progress(k.slice(3));if(!p){el.textContent="";return;}const d=p[0]>=p[1];el.className="pg"+(d?" done":"");el.textContent=d?"Done":`${p[0]}/${p[1]}`;}
  else if(k.startsWith("pr-")){const s=M.pr[k.slice(3)];el.innerHTML=`<span>${s.pct==null?"–":s.pct+"%"}</span>${chip(s.rating)}`;}
  else if(k.startsWith("prc-")){const s=M.pr[k.slice(4)];el.className="tag";el.textContent=s.pct==null?"–":s.pct+"%";}
  else if(k.startsWith("cap-")){el.textContent=capText(k.slice(4));}
  else if(k.startsWith("raci-")){const st=M.raci[+k.slice(5)];if(st){const x=RACI_ST[st.s];el.innerHTML=`<span class="chip ${x[1]}">${x[0]}</span>`;}}
  else if(k==="life")el.innerHTML=lifeHTML(M.pol);
  else if(k==="polsum"){const p=M.pol;el.textContent=p.assessed?`${p.written} written · ${p.approved} approved · ${p.assessed} of ${p.total} assessed`:"Set a status for each policy";}
  else if(k==="sep"){const v=sepVerdict(M);el.innerHTML=`<p style="font-size:24px;font-weight:600">${v[0]}</p>${M.gov.pct!=null?`<p class="small muted">${M.gov.pct}% · ${chip(M.gov.rating)}</p>`:""}`;}
  else if(k==="acc"){el.innerHTML=`<p style="font-size:24px;font-weight:600">${M.acc.pct==null?"–":M.acc.pct+"%"}</p>${chip(M.acc.rating)}`;}
 });}

function switchTo(id){if(!STORE.list[id])return;STORE.cur=id;S=STORE.list[id];persist();render();}

async function saveFile(filename,data){if(!DL){toast("File downloads aren’t available in this view.");return;}

async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Copied to the clipboard.");}catch(e){const b=$("#copyBuf")||document.createElement("textarea");b.value=t;if(!b.isConnected){b.className="sr";document.body.appendChild(b);}b.removeAttribute("aria-hidden");b.focus();b.select();let ok=false;try{ok=document.execCommand("copy");}catch(_){}toast(ok?"Copied to the clipboard.":"Press Ctrl+C (or ⌘C) to copy the selected text.");}}

function onEdit(e){const el=e.target;
 if(el.dataset.reg!==undefined){const k=el.dataset.reg;const a=S.org.regs.filter(x=>x!==k);if(el.checked)a.push(k);S.org.regs=a;touch();return;}

 const discrete=el.type==="radio"||el.type==="checkbox"||el.tagName==="SELECT";
 if(e.type==="input"&&discrete)return;if(e.type==="change"&&!discrete)return;
 let v;if(el.type==="checkbox")v=el.checked;else if(el.dataset.num!==undefined)v=el.value===""?null:Number(el.value);else v=el.value;
 setPath(p,v);touch();
 if(p==="org.name")renderCoSel();
 if(/^ans\.[a-z0-9]+\.a$/.test(p)){const card=el.closest(".qc");if(card)card.dataset.a=v==null?"":v;}
 if(/^dc\./.test(p)&&p.endsWith(".text")){const card=el.closest(".qc");if(card)card.dataset.a=String(v).trim()?"2":"";}
 if(p==="org.name"&&S.sample&&!/\(example\)/i.test(v)){S.sample=false;$("#sampleBanner").hidden=true;}
 refreshLive();}

 rd.readAsText(f);e.target.value="";});

function clip(s,n){s=String(s||"").trim();if(s.length<=n)return s;const cut=s.slice(0,n);const i=Math.max(cut.lastIndexOf(". "),cut.lastIndexOf("; "));return i>n*.4?cut.slice(0,i+1).replace(/;$/,"."):cut.slice(0,cut.lastIndexOf(" "))+"…";}

  return`<div class="sl"><p class="eb">Requirement 2 · Stakeholders</p><h2>Stakeholders mapped to lecture categories</h2><div class="g" style="grid-template-columns:1.2fr 1fr;flex:1"><div class="c" style="gap:.5cqw"><span class="lbl">Internal</span>${li(SH_IN,LV_IN)}</div><div class="c" style="gap:.5cqw"><span class="lbl">External</span>${li(SH_EX,LV_EX)}</div></div>${ft(c.n,c.t)}</div>`;});
 out.push(c=>`<div class="sl"><p class="eb">Requirement 2 · Decision rights</p><h2>Who actually decides: the observed RACI</h2><table><tr><th>Decision</th>${S.raci.roles.map(r=>`<th style="text-align:center">${esc(r)}</th>`).join("")}<th>Status</th></tr>${S.raci.rows.slice(0,8).map((r,i)=>`<tr><td>${esc(r.d)}</td>${r.c.map(x=>`<td class="cc" style="color:${x==="?"?"var(--sl-rust)":x===""?"var(--sl-muted)":x==="A"||x==="A/R"?"var(--sl-ink)":"var(--sl-green)"}">${esc(x||"–")}</td>`).join("")}<td>${pill(RACI_ST[M.raci[i].s][1],RACI_ST[M.raci[i].s][0])}</td></tr>`).join("")}</table><p style="font-size:1.4cqw"><b>${M.clear.length} of ${M.raci.filter(x=>x.s!=="unmapped").length}</b> key decisions have one clear accountable owner. R responsible · A accountable · C consulted · I informed · ? not formally defined.</p>${ft(c.n,c.t)}</div>`);
 out.push(c=>`<div class="sl"><p class="eb">Lecture link · Governance vs. management</p><h2>Governance and management: ${esc(sv[0].toLowerCase())}</h2><div class="g" style="grid-template-columns:1fr 1fr"><div class="c d"><span class="lbl">Governance · Evaluate, Direct, Monitor</span><span>What and why: direction, risk appetite, oversight</span></div><div class="c d"><span class="lbl">Management · Plan, Build, Run, Monitor</span><span>How: projects, services, operations</span></div></div><div class="g" style="grid-template-columns:1fr 1fr">${GOVQ.map(q=>{const v=eff(q);const r=v==null?"na":v<0?"na":v>=2?"strong":"weak";return`<div class="c"><span>${pill(r,v==null?"Not assessed":v<0?"To verify":v>=2?"In place":"Gap")}</span><span>${esc(v!=null&&v>=2?q.s:q.w)}</span></div>`;}).join("")}</div>${ft(c.n,c.t)}</div>`);

 out.push(c=>`<div class="sl"><p class="eb">Requirement 4 · ISO/IEC 38500 scorecard</p><h2>Preliminary rating on the six principles</h2><div class="g" style="grid-template-columns:repeat(3,1fr);flex:1">${PR.map(p=>{const s=M.pr[p.k];const col=s.rating==="strong"?"var(--sl-green)":s.rating==="partial"?"var(--sl-brass-ink)":s.rating==="weak"?"var(--sl-rust)":"#7C8A84";return`<div class="c" style="border-top:.4cqw solid ${col}"><span class="lbl" style="color:var(--sl-muted)">Principle ${p.n}</span><span class="big">${p.name}</span><div class="bar"><i style="width:${s.pct||0}%;background:${col}"></i></div><span>${pill(s.rating)} <b style="font-family:var(--f-mono)">${s.pct==null?"":s.pct+"%"}</b></span>${(()=>{const g=p.qs.filter(q=>{const v=eff(q);return v===0||v===1;}).sort((a,b)=>eff(a)-eff(b))[0];const st=p.qs.find(q=>eff(q)===3);return`${st?`<span style="font-size:1.2cqw"><b style="color:var(--sl-green)">+</b> ${esc(st.s)}</span>`:""}${g?`<span style="font-size:1.2cqw"><b style="color:var(--sl-rust)">−</b> ${esc(g.w)}</span>`:""}`;})()}</div>`;}).join("")}</div>${ft(c.n,c.t)}</div>`);
 out.push(c=>`<div class="sl"><p class="eb">Requirement 4 · Summary</p><h2>Strengths to build on, gaps to close</h2><div class="g" style="grid-template-columns:1fr 1fr;flex:1"><div class="c"><span class="lbl" style="color:var(--sl-green)">Strengths</span><ul>${(M.strengths.slice(0,5).map(x=>`<li>${esc(x.text)}</li>`).join(""))||"<li>None confirmed yet</li>"}</ul></div><div class="c d"><span class="lbl">Gaps</span><ul>${(M.gaps.slice(0,5).map(x=>`<li>${esc(x.text)}</li>`).join(""))||"<li>None identified yet</li>"}</ul></div></div>${ft(c.n,c.t)}</div>`);
 out.push(c=>`<div class="sl br"><p class="eb">Requirement 5 · Reflection</p><h2>Where responsibility is clear, and where it is ambiguous</h2><div class="g" style="grid-template-columns:1fr 1.2fr;flex:1"><div class="c d"><span class="lbl">Clear</span><ul>${M.clear.length?M.clear.slice(0,6).map(x=>`<li>${esc(x.d)}</li>`).join(""):"<li>Nothing confirmed yet</li>"}</ul></div><div class="c" style="background:#F4E6C6;border-color:var(--sl-ink)"><span class="lbl" style="color:var(--sl-ink)">Ambiguous</span><ul>${M.amb.length?M.amb.slice(0,6).map(x=>`<li>${esc(x.d)}: <span class="m">${esc(x.why)}</span></li>`).join(""):"<li>Nothing flagged</li>"}</ul></div></div>${ft(c.n,c.t)}</div>`);
 out.push(c=>`<div class="sl"><p class="eb">Lecture link · Accountability &amp; transparency</p><h2>Accountability mechanisms in place: ${M.acc.pct==null?"not assessed":M.acc.pct+"%"}</h2><table><tr><th style="width:62%">Mechanism (Slide 56)</th><th>Status</th></tr>${ACCQ.map(q=>{const v=eff(q);return`<tr><td>${esc(q.s)}</td><td>${v==null?pill("na","Not assessed"):v<0?pill("na","To verify"):v>=2?pill(v===3?"strong":"partial",v===3?"In place":"Partly"):pill("weak",v===1?"Informal":"Missing")}</td></tr>`;}).join("")}</table><p style="font-size:1.4cqw">Stakeholders cannot hold anyone to account for outcomes they cannot see.</p>${ft(c.n,c.t)}</div>`);
 out.push(c=>{const t=(S.disc.text||draftDiscussion(M)).split(/\n\n/);const pos=POS.find(p=>p.k===(S.disc.pos||"layered"));
  return`<div class="sl dk"><p class="eb">Executive discussion · Slide 58</p><h2 style="max-width:70cqw">“Who should be responsible when a technology investment fails?”</h2><div class="g" style="grid-template-columns:.8fr 1.6fr;flex:1"><div class="c" style="background:var(--sl-brass);border-color:var(--sl-brass);color:var(--sl-ink)"><span class="lbl" style="color:var(--sl-ink)">My position</span><span class="big">${esc(pos.l)}</span><span>${esc(pos.d)}</span></div><div class="c d" style="background:#1A2D26;border-color:#1A2D26"><span class="lbl">Argument</span><p style="font-size:1.35cqw">${esc(clip(t[0],420))}</p>${t[2]?`<p style="font-size:1.25cqw;color:var(--sl-deep-muted)">${esc(clip(t[2],460))}</p>`:t[1]?`<p style="font-size:1.25cqw;color:var(--sl-deep-muted)">${esc(clip(t[1],460))}</p>`:""}</div></div>${ft(c.n,c.t)}</div>`;});
 out.push(c=>`<div class="sl"><p class="eb">Next steps · Input to Part 2</p><h2>Priority actions</h2><div class="g" style="grid-template-columns:1.6fr 1fr;flex:1"><div class="c"><ol style="font-size:1.45cqw">${(M.recs.map(r=>`<li>${esc(r)}</li>`).join(""))||"<li>Answer more questions to generate actions</li>"}</ol></div><div class="c d"><span class="lbl">Evidence still to collect</span><span class="big" style="font-size:5cqw;color:var(--sl-brass)">${M.verify.length}</span><span class="m">items marked “verify”, “don’t know” or verbal only</span></div></div>${ft(c.n,c.t)}</div>`);
 out.push(c=>`<div class="sl dk"><p class="eb">Discussion</p><div style="flex:1"></div><h1>Questions and discussion</h1><div class="g" style="grid-template-columns:repeat(4,1fr)">${["strong","partial","weak","na"].map(r=>`<div style="border-top:.3cqw solid ${r==="strong"?"#5FBF98":r==="partial"?"var(--sl-brass)":r==="weak"?"#E07A66":"#5A6862"};padding-top:1cqw"><span style="font-family:var(--f-display);font-size:6cqw;font-weight:600">${M.counts[r]}</span><p class="m" style="font-family:var(--f-mono);font-size:1cqw;text-transform:uppercase;letter-spacing:.15cqw">${r==="na"?"Not rated":"Rated "+RL[r].toLowerCase()}</p></div>`).join("")}</div>${ft(c.n,c.t)}</div>`);
 return out;}
function openPresent(){slides=buildSlides();si=0;$("#present").hidden=false;showSlide();document.addEventListener("keydown",pkey);}
function closePresent(){$("#present").hidden=true;document.removeEventListener("keydown",pkey);try{if(document.fullscreenElement)document.exitFullscreen();}catch(_){}}
function showSlide(){const t=slides.length;$("#stage").innerHTML=slides[si]({n:si+1,t});$("#pcount").textContent=`${si+1} / ${t}`;}
function go(d){si=Math.max(0,Math.min(slides.length-1,si+d));showSlide();}
function pkey(e){if(e.key==="Escape")closePresent();else if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();go(1);}else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(-1);}}
$("#stage").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect();go(e.clientX<r.left+r.width/3?-1:1);});

/* ============ boot ============ */
try{const ar=localStorage.getItem("govlens38500:ar");if(ar==="0"){$("#arTog").checked=false;$("#app").classList.remove("show-ar");}}catch(_){}
loadStore();setSave("saved");
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
render();
(async()=>{try{if(window.claude&&typeof window.claude.use==="function")DL=await window.claude.use("downloads");}catch(_){DL=null;}updateDL();})();
})();
